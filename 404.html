<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Shield.labs</title>
  <meta name="description" content="A página que você procurou não existe. Volte para o início do site da Shield.labs.">
  <meta name="robots" content="noindex">

  <meta name="theme-color" content="#040E1E">
  <!-- URLs absolutas: a página 404 é servida pelo GitHub Pages em qualquer caminho, então caminhos relativos quebrariam. -->
  <link rel="icon" href="https://shieldlabs.app/assets/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="https://shieldlabs.app/assets/img/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://shieldlabs.app/assets/img/favicon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap">
  <link rel="stylesheet" href="https://shieldlabs.app/assets/css/style.css">
</head>
<body>
  <main class="error-page">
    <div>
      <img src="https://shieldlabs.app/assets/img/logo-aegis.png" alt="Ícone do Aegis" width="96" height="96">
      <p class="eyebrow">Erro 404</p>
      <h1>Página não encontrada</h1>
      <div class="filete" aria-hidden="true"></div>
      <p>O endereço que você tentou acessar não existe ou mudou de lugar.</p>
      <a class="btn btn-primary" href="https://shieldlabs.app/">Voltar para o início</a>
    </div>
  </main>
</body>
</html>
